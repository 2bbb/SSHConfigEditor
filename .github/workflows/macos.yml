name: macOS

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test
        run: swift test
      - name: Build universal app
        env:
          UNIVERSAL: '1'
        run: bash scripts/build.sh

  release:
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SIGNING_IDENTITY: 'Developer ID Application: ISHII 2BIT PROGRAM OFFICE (RS3AQSY9YN)'
      EXPECTED_TEAM_ID: RS3AQSY9YN
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Import Developer ID
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/ci-import-certificate.sh
      - name: Package and verify
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "RELEASE_LABEL=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            RELEASE_LABEL="$GITHUB_REF_NAME" bash scripts/package-release.sh
          else
            echo 'RELEASE_LABEL=latest' >> "$GITHUB_ENV"
            RELEASE_LABEL=latest bash scripts/package-release.sh
          fi
      - name: Publish ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          cat docs/RELEASE-NOTES.md > "$notes"
          printf '\nCommit: %s\n' "$GITHUB_SHA" >> "$notes"
          assets=(artifacts/releases/*.zip artifacts/releases/*.sha256)
          if [[ "$RELEASE_LABEL" == latest ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true || \
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref=refs/tags/latest -f sha="$GITHUB_SHA"
            if gh release view latest >/dev/null 2>&1; then
              gh release upload latest "${assets[@]}" --clobber
              gh release edit latest --title 'Latest development build' --notes-file "$notes" --prerelease --latest=false
            else
              gh release create latest "${assets[@]}" --verify-tag --title 'Latest development build' \
                --notes-file "$notes" --prerelease --latest=false
            fi
          else
            gh release create "$RELEASE_LABEL" "${assets[@]}" --verify-tag \
              --title "$RELEASE_LABEL" --notes-file "$notes" --latest
          fi
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ssh-config-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12"
